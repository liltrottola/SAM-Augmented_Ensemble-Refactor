experiment:
  name: "PolypPVT_Vanilla"
  seed: 37

# all paths are relative to the location of Train.py in src/models/PolypPVT/
paths:
  datasets_root: "../../../datasets/"
  aux_root: "../../../output/augmentation/sam2/ourSAMAug/"  # subfolders must match datasets.train names


  # ------ TRAINING --------
  models_dir: "../../../output/models/"
  log_file: "train_log_polypvt_vanilla.log"

  # ------ TESTING ------
  prediction_dir: "../../../output/predictions/"

training:
  epochs: 150
  batchsize: 16
  trainsize: 352

  size_rates: [0.75, 1.0, 1.25]
  clip_margin: 0.5

  augmentation: false

  optimizer:
    type: "AdamW"
    lr: 0.0001
    weight_decay: 0.0001

  lr_schedule:
    decay_rate: 0.1
    decay_epoch: 200

testing:
  test_checkpoint: "PolypPVT_Vanilla.pth"
  testsize: 352

datasets:
  train:
    - "TrainDataset"
  test:
    - "TestDataset"
    #- "CVC-300"
    #- "CVC-ClinicDB"
    #- "CVC-ColonDB"
    #- "Kvasir"
    #- "ETIS-LaribPolypDB"
