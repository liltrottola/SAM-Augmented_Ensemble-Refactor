experiment:
  name: "PolypPVT_Vanilla"
  seed: 37

# all paths are relative to the location of Train.py in src/models/PolypPVT/
paths:
  datasets_root: "../../../datasets/"
  offline_aug_base: "../../../datasets/"   # offline DA train sets (da1/da2/clahe): <offline_aug_base>/<da>/<dataset>/ (= datasets_root)

  # ------ TRAINING --------
  models_dir: "../../../output/models/"
  log_file: "train_log_polypvt_vanilla.log"

  # ------ TESTING ------
  prediction_dir: "../../../output/predictions/"
  logits_dir: "../../../output/logits/"

training:
  epochs: 50
  batchsize: 16
  trainsize: 352

  size_rates: [0.75, 1.0, 1.25]
  clip_margin: 0.5

  offline_augmentation: noda # "da1", "da2" or "noda" (no offline augmentation)
  online_augmentation: da3 # "da3" or null (no online augmentation)

  lr_method: lrbase  # "lra" | "lrb" | "lrc" | lrbase (uses the legacy optimizer/lr_schedule block, 50 training epochs)

  optimizer:
    type: "AdamW"
    lr: 0.0001
    weight_decay: 0.0001

  lr_schedule:
    milestones: [15, 30] # Epochs at which to decay the learning rate
    decay_factor: 0.5 # Factor by which to decay the learning rate at each milestone


testing:
  test_checkpoint: "PolypPVT_Vanilla.pth"
  testsize: 352

datasets:
  train:
    - "TrainDataset"
  test:
    - "TestDatasets/CVC-300"
    - "TestDatasets/CVC-ClinicDB"
    - "TestDatasets/CVC-ColonDB"
    - "TestDatasets/Kvasir"
    - "TestDatasets/ETIS-LaribPolypDB"
    - "TestDatasets/PolypGen_C1"
    - "TestDatasets/PolypGen_C2"
    - "TestDatasets/PolypGen_C3"
    - "TestDatasets/PolypGen_C4"
    - "TestDatasets/PolypGen_C5"
    - "TestDatasets/PolypGen_C6"
    #- "TestDatasets/FAR-POLYP-SEG_full"
