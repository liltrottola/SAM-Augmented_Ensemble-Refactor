models:
  - name: hsnet
    has_aux: false
    folder: "HSNet"
    train_script: "Train_vanilla.py"
    test_script: "Test_vanilla.py"

  - name: hsnet_aux
    has_aux: true
    folder: "HSNet"
    train_script: "Train_aux.py"
    test_script: "Test_aux.py"

  - name: polypvt_aux
    has_aux: true
    folder: "PolypPVT"
    train_script: "Train_aux.py"
    test_script: "Test_aux.py"

  - name: polypvt
    has_aux: false
    folder: "PolypPVT"
    train_script: "Train_vanilla.py"
    test_script: "Test_vanilla.py"

# training section
training:
  runs: 1
  seeds: [37, 42, 123, 456, 789]

  # Choose [1], [2], or [1, 2]
  sam_versions: [1, 2]

  #List of method names
  aug_methods:
    - "SAMAug"
    - "ourSAMAug"
    - "RG_segPrior"
    - "SV_segPrior"
    - "RG_logits"
    - "PCA_segPrior"

  # Asse LR (diversità d'ensemble): null = path legacy, + i 3 metodi del paper
  lr_methods:
    - null
    - "lra"
    - "lrb"
    - "lrc"

  # Asse DA (solo modelli vanilla): null = nessuna aug, da1/da2 offline, da3 online
  da_methods:
    - null
    - "da1"
    - "da2"
    - "da3"

#inference/testing section
testing:
  runs: 1

  # Choose [1], [2], or [1, 2]
  sam_versions: [1, 2]

  #List of method names
  aug_methods:
    - "SAMAug"
    - "ourSAMAug"
    - "RG_segPrior"
    - "SV_segPrior"
    - "RG_logits"
    - "PCA_segPrior"

  lr_methods:
    - null
    - "lra"
    - "lrb"
    - "lrc"

  # Deve combaciare con training.da_methods per ritrovare i checkpoint
  da_methods:
    - null
    - "da1"
    - "da2"
    - "da3"
