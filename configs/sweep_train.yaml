# models to launch (comment / uncomment): names from configs/sweep_registry.yaml, where folder,
# scripts and model yaml of each model are defined (--model on the CLI replaces this list)
# HGM needs its own conda env: launch it with --model hgm from the HGM env, not in a full sweep
models:
  - "hsnet"
  - "hsnet_aux"
  - "hsnet_n3"
  - "polypvt"
  - "polypvt_aux"
  - "polypvt_n3"
  - "hgm"
  - "hgm_aux"        # HGM conda env only: launch with --model hgm_aux
  - "hgm_n3"         # HGM conda env only: launch with --model hgm_n3
  - "sam2unet"
  - "sam2unet_aux"
  - "sam2unet_n3"

# training section
training:
  runs: 5
  seeds: [37, 42, 123, 456, 789]

  # Aux axis (aux models only): source folder must be under output/augmentation/ -> its own method list.
  # The source name is also the checkpoint prefix (e.g. sam2_RG_logits_hsnet_aux_da3_lrbase_run1).

  aux_sources:
    sam1:
      - "SAMAug"
      - "ourSAMAug"
      - "RG_segPrior"
      - "SV_segPrior"
      - "RG_logits"
      - "PCA_segPrior"
    sam2:
      - "SAMAug"
      - "ourSAMAug"
      - "RG_segPrior"
      - "SV_segPrior"
      - "RG_logits"
      - "PCA_segPrior"
    # depth aux images from run_depth_augmentation.py (method names as in src/augmentation/depth_prior_methods.py)
    da3mono-large:
      - "DepthAug"
      - "RG_voteV3"
      - "RG_depth"
      - "PCA_voteV3"
      - "RG_localnorm"
      - "LAB_gamut_aplus"

  # N3 axis (N3 models only): the prior channels after the RGB, per family (sam / depth / dsine, folder of each family in
  # prior_sources of configs/sweep_registry.yaml, where the priors are checked). Order: families as in the registry,
  # then the priors as written here. One combination per sweep (another one: edit here or --sam_priors / --depth_priors /
  # --dsine_priors). The prior names go into the checkpoint name
  # (e.g. segPrior-boundaryPrior-frst_prior-localnorm_hsnet_n3_da3_lrbase_run1). Must match sweep_test.yaml.
  prior_sources:
    sam:
      - "segPrior"
      - "boundaryPrior"
    depth:
      - "frst_prior"
      - "localnorm"

  # LR axis (ensemble diversity): lrbase = legacy path, + the 3 methods from the paper
  lr_methods:
    - "lrbase"
    #- "lra"
    #- "lrb"
    #- "lrc"

  # Train set axis: folders under datasets/ (each with images/ and masks/); always in the checkpoint name, first
  # (e.g. TrainDataset_hsnet_da3_lrbase_run1). Offline DA reads datasets/<da>/<train set>, aux and priors follow it.
  train_datasets:
    - "TrainDataset"

  # DA axis: "noda" = no augmentation at all, da1/da2 offline (vanilla only), da3 online (vanilla + aux)
  da_methods:
    #- "noda"
    #- "da1"
    #- "da2"
    - "da3"
