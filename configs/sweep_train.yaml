models:
  - name: hsnet
    has_aux: false
    folder: "HSNet"
    train_script: "Train_vanilla.py"
    test_script: "Test_vanilla.py"
    config: "../configs/hsnet_vanilla.yaml"

  - name: hsnet_aux
    has_aux: true
    folder: "HSNet"
    train_script: "Train_aux.py"
    test_script: "Test_aux.py"
    config: "../configs/hsnet_aux.yaml"

  - name: polypvt_aux
    has_aux: true
    folder: "PolypPVT"
    train_script: "Train_aux.py"
    test_script: "Test_aux.py"
    config: "../configs/polypPVT_aux.yaml"

  - name: polypvt
    has_aux: false
    folder: "PolypPVT"
    train_script: "Train_vanilla.py"
    test_script: "Test_vanilla.py"
    config: "../configs/polypPVT_vanilla.yaml"

# training section
training:
  runs: 5
  seeds: [37, 42, 123, 456, 789]

  # Choose [1], [2], or [1, 2]
  sam_versions: [1, 2]

  #List of SAM method names
  aug_methods:
    - "SAMAug"
    - "ourSAMAug"
    - "RG_segPrior"
    - "SV_segPrior"
    - "RG_logits"
    - "PCA_segPrior"

  # LR axis (ensemble diversity): lrbase = legacy path, + the 3 methods from the paper
  lr_methods:
    - "lrbase"
    #- "lra"
    #- "lrb"
    #- "lrc"

  # DA axis: "noda" = no augmentation at all, da1/da2 offline (vanilla only), da3 online (vanilla + aux)
  da_methods:
    #- "noda"
    #- "da1"
    #- "da2"
    - "da3"
