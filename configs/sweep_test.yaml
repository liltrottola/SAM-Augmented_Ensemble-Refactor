# models to launch (comment / uncomment): names from configs/sweep_registry.yaml, where folder,
# scripts and model yaml of each model are defined (--model on the CLI replaces this list)
# HGM needs its own conda env: launch it with --model hgm from the HGM env, not in a full sweep
models:
  - "hsnet"
  - "hsnet_aux"
  - "polypvt"
  - "polypvt_aux"
  - "hgm"
  - "sam2unet"

# inference/testing section
testing:
  runs: 5

  # Must match the aux_sources used at training time to find the checkpoints
  # source folder must be under output/augmentation/ -> its own method list
  aux_sources:
    sam1:
      - "SAMAug"
      - "ourSAMAug"
      - "RG_segPrior"
      - "SV_segPrior"
      - "RG_logits"
      - "PCA_segPrior"
    sam2:
      - "SAMAug"
      - "ourSAMAug"
      - "RG_segPrior"
      - "SV_segPrior"
      - "RG_logits"
      - "PCA_segPrior"
    da3mono-large:
      - "DepthAug"
      - "RG_voteV3"
      - "RG_depth"
      - "PCA_voteV3"
      - "RG_localnorm"
      - "LAB_gamut_aplus"

  lr_methods:
    - "lrbase"
   # - "lra"
   # - "lrb"
   # - "lrc"

  # Must match the da_methods used at training time to find the checkpoints
  da_methods:
   # - "noda"
    #- "da1"
    #- "da2"
    - "da3"
