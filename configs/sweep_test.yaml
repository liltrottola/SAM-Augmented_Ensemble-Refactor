# NOTE: the `models` list must stay in sync with sweep_train.yaml (same names,
# folders, scripts, config). It is duplicated on purpose so a test sweep can be
# edited while a training job is still queued on the cluster, without the two
# ever touching the same file. Only the model registry is shared; the axes below
# are independent from training on purpose.
models:
  - name: hsnet
    has_aux: false
    folder: "HSNet"
    train_script: "Train_vanilla.py"
    test_script: "Test_vanilla.py"
    config: "../configs/hsnet_vanilla.yaml"

  - name: hsnet_aux
    has_aux: true
    folder: "HSNet"
    train_script: "Train_aux.py"
    test_script: "Test_aux.py"
    config: "../configs/hsnet_aux.yaml"

  - name: polypvt_aux
    has_aux: true
    folder: "PolypPVT"
    train_script: "Train_aux.py"
    test_script: "Test_aux.py"
    config: "../configs/polypPVT_aux.yaml"

  - name: polypvt
    has_aux: false
    folder: "PolypPVT"
    train_script: "Train_vanilla.py"
    test_script: "Test_vanilla.py"
    config: "../configs/polypPVT_vanilla.yaml"

  # HGM needs its own conda env (mamba_ssm, torch_geometric): always run it with --model hgm
  # from the HGM conda env, never in a full sweep from venv_newSAMAug
  - name: hgm
    has_aux: false
    folder: "HGM"
    train_script: "Train_vanilla.py"
    test_script: "Test_vanilla.py"
    config: "../configs/hgm_vanilla.yaml"

  - name: sam2unet
    has_aux: false
    folder: "SAM2UNet"
    train_script: "Train_vanilla.py"
    test_script: "Test_vanilla.py"
    config: "../configs/sam2unet_vanilla.yaml"

# inference/testing section
testing:
  runs: 5

  # Choose [1], [2], or [1, 2]
  sam_versions: [1, 2]

  #List of method names
  aug_methods:
    - "SAMAug"
    - "ourSAMAug"
    - "RG_segPrior"
    - "SV_segPrior"
    - "RG_logits"
    - "PCA_segPrior"

  lr_methods:
    - "lrbase"
   # - "lra"
   # - "lrb"
   # - "lrc"

  # Must match the da_methods used at training time to find the checkpoints
  da_methods:
   # - "noda"
    #- "da1"
    #- "da2"
    - "da3"
