experiment:
  name: "HGM_Aux"
  seed: 37
  aux_source: "sam2"   # folder under aux_root_base with the aux images (sam1, sam2, sam2_stab085, da3mono-large, ...)
  method: "ourSAMAug"

#all paths are relative to the location of Train.py file in src/models/HGM/
paths:
  datasets_root: "../../../datasets/"
  aux_root_base: "../../../output/augmentation/"  # aux images from run_sam_augmentation.py / run_depth_augmentation.py
  offline_aug_base: "../../../datasets/"   # offline DA train sets (da1/da2/clahe): <offline_aug_base>/<da>/<dataset>/ (= datasets_root)

  #------ TRAINING --------
  models_dir: "../../../output/models/"
  log_file: "train_log_hgm_aux.log"

  #------TESTING ------
  prediction_dir: "../../../output/predictions/"
  logits_dir: "../../../output/logits/"

training:
  epochs: 100       # original HGM: 100
  batchsize: 8      # original HGM: 8
  trainsize: 352

  size_rates: [0.75, 1.0, 1.25] 
  clip_margin: 0.5              

  num_workers: 4 # original nworker 4 (to be equal to hsnet/polyp use 1)


  offline_augmentation: noda # "da1", "da2", "clahe" or "noda": train on the DA train set, with aux generated on it (<aux_source>/<method>/<da>/<dataset>)
  online_augmentation: noda # "da3" or "noda" (no online augmentation)

  lr_method: lrbase   # "lra" | "lrb" | "lrc" | "lrbase" (uses the legacy optimizer/lr_schedule block)

  optimizer:
    type: "Adam"      # original HGM: torch.optim.Adam without weight decay
    lr: 0.00003       # original HGM: --lr 3e-5
    weight_decay: 0.0 # not used by the Adam branch

  lr_schedule:
    milestones: [50, 100] 
    decay_factor: 0.1    

testing:
  test_checkpoint: "HGM_Aux.pth"
  testsize: 352

datasets:
  train:
    - "TrainDataset"
  test:
    - "TestDatasets/CVC-300"
    - "TestDatasets/CVC-ClinicDB"
    - "TestDatasets/CVC-ColonDB"
    - "TestDatasets/Kvasir"
    - "TestDatasets/ETIS-LaribPolypDB"
