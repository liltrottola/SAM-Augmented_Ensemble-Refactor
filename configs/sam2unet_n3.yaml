experiment:
  name: "SAM2UNet_N3" # checkpoint name when Train_N3 is launched without --model_name (run_training.py always passes it)
  seed: 37

#all paths are relative to the location of Train.py file in src/models/SAM2UNet/
paths:
  datasets_root: "../../../datasets/"
  offline_aug_base: "../../../datasets/"   # offline DA train sets (da1/da2/clahe/light): <offline_aug_base>/<da>/<dataset>/ (= datasets_root)
  # N3: priors in <prior_root>/<folder>/[<da>/]<dataset>/<prior>/<name>.npy, folder of each family in prior_sources
  # of configs/sweep_registry.yaml (offline DA: the priors generated on the DA train set)
  prior_root: "../../../output/priors/"
  hiera_path: "../../../checkpoints_sam/sam2_hiera_large.pt" # SAM2 Hiera-L checkpoint, used only at training

  #------ TRAINING --------
  models_dir: "../../../output/models/"
  log_file: "train_log_sam2unet_n3.log"

  #------TESTING ------
  prediction_dir: "../../../output/predictions/"
  logits_dir: "../../../output/logits/"

# training hyperparameters = sam2unet_vanilla.yaml
training:
  epochs: 20        # original SAM2-UNet 20
  batchsize: 12     # original SAM2-UNet 12
  trainsize: 352

  size_rates: [0.75, 1.0, 1.25] # Multi-scale; [1.0] = original train.py (no multi-scale)
  clip_margin: null             # original SAM2-UNet has no gradient clipping

  num_workers: 8 # original nworker 8 (to be equal to hsnet/polyp use 1)

  offline_augmentation: noda # "da1", "da2", "clahe", "light" or "noda": DA train set + the priors generated on it
  online_augmentation: noda  # "da3" (geometric on all channels, photometric only on the RGB) or "noda"; never both with offline

  lr_method: lrbase   # "lra" | "lrb" | "lrc" | "lrbase" (uses the legacy optimizer/lr_schedule block)

  optimizer:
    type: "AdamW"         # original SAM2-UNet: AdamW
    lr: 0.001             # original --lr 1e-3
    weight_decay: 0.0005  # original --weight_decay 5e-4

  lr_schedule:
    eta_min: 1.0e-7  # original CosineAnnealingLR(T_max=epochs, eta_min=1e-7), used only with lrbase

# N3: input = RGB + prior channels (N = 3 + number of priors) -> ChannelReduction(N) -> SAM2UNet()
n3:
  # default prior channels after the RGB, per family (sam / depth / dsine), as prior_sources of the sweeps; families and
  # priors checked against prior_sources of configs/sweep_registry.yaml (where the folder of each family is).
  # Order: families as in the registry, then the priors as written here (same order at test time).
  # --sam_priors / --depth_priors / --dsine_priors replace this list (families not given = not used).
  prior_sources:
    sam:
      - "segPrior"
      - "boundaryPrior"
    depth:
      - "frst_prior"
      - "localnorm"
  # false = block output used directly; true = RGB + block, last conv at zero
  residual: false
  # kernel of the FIRST conv of the block: 1 = per-pixel, 3 = 3x3 neighbourhood
  kernel_size: 1
  # LR of the block = optimizer.lr * reduce_lr_mult (SAM2-UNet keeps optimizer.lr); 30 as HSNet, but here the block LR
  # is 3e-2 (base lr 1e-3, no gradient clipping): check the loss in the debug run, lower it (e.g. 1.5 -> 1.5e-3) if it diverges
  reduce_lr_mult: 30

testing:
  test_checkpoint: "SAM2UNet_N3.pth" # checkpoint tested when Test_N3 is launched without --model_pth (run_inference.py always passes it)
  testsize: 352

datasets:
  train:
    - "TrainDataset"
  test:
    - "TestDatasets/CVC-300"
    - "TestDatasets/CVC-ClinicDB"
    - "TestDatasets/CVC-ColonDB"
    - "TestDatasets/Kvasir"
    - "TestDatasets/ETIS-LaribPolypDB"
