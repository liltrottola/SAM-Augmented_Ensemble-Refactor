experiment:
  name: "HSNet_Aux_DA3"
  seed: 37
  sam_version: 2
  method: "ourSAMAug"

# all paths are relative to the location of Train.py in src/models/HSNet/
paths:
  datasets_root: "../../../datasets/"
  aux_root_base: "../../../output/augmentation/"  # SAM-augmented images from run_augmentation.py

  # ------ TRAINING --------
  models_dir: "../../../output/models/"
  log_file: "train_log_hsnet_aux.log"

  # ------ TESTING ------
  prediction_dir: "../../../output/predictions/"
  logits_dir: "../../../output/logits/"

training:
  epochs: 40 #legacy
  batchsize: 8 #legacy
  trainsize: 352

  size_rates: [0.75, 1.0, 1.25]
  clip_margin: 0.5

  augmentation: null # "da1"| "da2"| "da3" | null (no augmentation)
  lr_method: lrbase   # "lra" | "lrb" | "lrc" | "lrbase" (uses the legacy optimizer/lr_schedule block)


  optimizer:
    type: "Adam"
    lr: 0.00005 #legacy
    weight_decay: 0 #legacy

  lr_schedule:
    milestones: [20]
    gamma: 0.2   # MultiStepLR gamma (multiplicative factor)

testing:
  test_checkpoint: "HSNet_Aux_DA3.pth"
  testsize: 352

#for each dataset, specify the corresponding path in paths.datasets_root
datasets:
  train:
    - "TrainDataset"
  test:
    - "TestDatasets/CVC-300"
    - "TestDatasets/CVC-ClinicDB"
    - "TestDatasets/CVC-ColonDB"
    - "TestDatasets/Kvasir"
    - "TestDatasets/ETIS-LaribPolypDB"
