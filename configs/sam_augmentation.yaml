experiment:
  name: sam_augmentation
  description: Aux images for the aux models built from the SAM priors saved by run_sam_generation.py (SAM does not run here)

# all paths are relatives to the home directory of the project SAM-Augmented_Ensemble-refactor
paths:
  # base path of the datasets
  dataset_root: "datasets/"
  # prior maps (.npy float32, image size) written by run_sam_generation.py: <prior_root>/<prior_source>/<dataset>/<prior>/<name>.npy
  # prior_source = sam folder built by run_sam_generation.py (sam1, or sam2_stab<threshold> e.g. sam2_stab085): run that script first
  prior_root: "output/priors/"
  prior_source: "sam2_stab085"
  # aux images: <output_root>/<aux_source>/<method>/<dataset>/images/<name>.png
  output_root: "output/augmentation/"
  # folder name under output_root = --aux_source of Train_aux.py / Test_aux.py (key in aux_sources of the sweep yaml).
  # An existing folder with the same name is overwritten
  aux_source: "sam2_stab085"

datasets:
  # List of datasets to use for training and testing
  folders:
    - "ProvaSmall/"          # pipeline test (original + its offline DA sets)
    - "da1/ProvaSmall/"
    - "da2/ProvaSmall/"
    #- "TrainDataset/"
    #- "TestDatasets/CVC-300/"
    #- "TestDatasets/CVC-ClinicDB/"
    #- "TestDatasets/CVC-ColonDB/"
    #- "TestDatasets/Kvasir/"
    #- "TestDatasets/ETIS-LaribPolypDB/"

# priors loaded for every image (folder names under <prior_root>/<prior_source>/<dataset>/),
# passed to the methods as priors[<name>]: every prior used by a method below must be listed here
priors:
  - "segPrior"        # sum of the stability scores of the overlapping masks
  - "boundaryPrior"   # contours of the masks, {0,1}
  - "areaPrior"       # relative area of the masks, summed where they overlap
  - "logits"          # logits of the predictor on the whole image

augmentation:
  # names exactly as defined in src/augmentation/sam_prior_methods.py
  methods:
    - "SAMAug"          # G += segPrior, B += boundaryPrior
    - "ourSAMAug"       # R += areaPrior, G += segPrior, B += boundaryPrior
    - "RG_segPrior"     # R, G, B = segPrior
    - "SV_segPrior"     # G, B, segPrior of the RGB (despite the name, no HSV: see sam_prior_methods.py)
    - "RG_logits"       # R, G, B = logits
    - "PCA_segPrior"    # PCA 3->2 of RGB, B = segPrior
