experiment:
  name: "PolypPVT_Aux_DA3"
  seed: 10
  aux_source: "sam2"   # folder under aux_root_base with the aux images (sam1, sam2, sam2_stab085, da3mono-large, ...)
  method: "ourSAMAug"

# all paths are relative to the location of Train.py in src/models/PolypPVT/
paths:
  datasets_root: "../../../datasets/"
  aux_root_base: "../../../output/augmentation/"  # aux images from run_sam_augmentation.py / run_depth_augmentation.py
  offline_aug_base: "../../../output/augmentation/"   # offline DA train sets (da1/da2/clahe): <offline_aug_base>/<da>/<dataset>/

  # ------ TRAINING --------
  models_dir: "../../../output/models/"
  log_file: "train_log_polypvt_aux.log"

  # ------ TESTING ------
  prediction_dir: "../../../output/predictions/"
  logits_dir: "../../../output/logits/"

training:
  epochs: 40 
  batchsize: 16
  trainsize: 352

  size_rates: [0.75, 1.0, 1.25]
  clip_margin: 0.5

  offline_augmentation: noda # "da1", "da2", "clahe" or "noda": train on the DA train set, with aux generated on it (<aux_source>/<method>/<da>/<dataset>)
  online_augmentation: noda # "da3" or "noda" (no online augmentation)
  lr_method: lrbase   # "lra" | "lrb" | "lrc" | lrbase (uses the legacy optimizer/lr_schedule block, 50 training epochs)

  optimizer:
    type: "AdamW"
    lr: 0.0001
    weight_decay: 0

  lr_schedule:
    milestones: [20]
    gamma: 0.2

testing:
  test_checkpoint: "PolypPVT_Aux_DA3.pth"
  testsize: 352

datasets:
  train:
    - "TrainDataset"
  test:
    - "TestDatasets/CVC-300"
    - "TestDatasets/CVC-ClinicDB"
    - "TestDatasets/CVC-ColonDB"
    - "TestDatasets/Kvasir"
    - "TestDatasets/ETIS-LaribPolypDB"
